# Streak or Bust connection server. Cloudflare builds and deploys this folder from GitHub on
# every push to main (Workers Builds, root directory "signal").
name = "streakorbust-signal"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

routes = [
  { pattern = "signal.streakorbust.com", custom_domain = true }
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Rooms"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rooms"]
